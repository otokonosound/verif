name: VÉRIF CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

concurrency:
  group: verif-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Test frontend
        run: npm test
      - name: Test server engine
        run: npm run test:api
      - name: Build
        run: npm run build
