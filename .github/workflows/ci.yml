name: VÉRIF CI
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verif-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: verif-extension
          path: dist/downloads/verif-extension.zip
