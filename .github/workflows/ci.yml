name: VÉRIF CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

concurrency:
  group: verif-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Test frontend
        run: npm test
      - name: Test extension
        run: npm run test:extension
      - name: Test server engine
        run: npm run test:api
      - name: Build
        run: npm run build
      - name: Validate runtime scripts
        run: node --check extension/analyzer.js && node --check extension/background.js && node --check extension/content.js && node --check extension/popup.js && node --check extension/research.js && node --check extension/local-ai.js && node --check public/sw.js && node --check server/research.mjs
      - name: Validate extension manifest
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('extension/manifest.json','utf8')); if(m.manifest_version!==3 || !m.background?.service_worker || !m.action?.default_popup) process.exit(1); console.log('Manifest V3 OK')"
      - name: Validate VÉRIF 2.0 share target
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('public/manifest.webmanifest','utf8')); if(m.share_target?.method!=='POST' || m.share_target?.enctype!=='multipart/form-data' || !m.share_target?.params?.files?.length) process.exit(1); console.log('Share target OK')"
      - name: Validate mail integration
        run: node -e "const fs=require('fs'); const c=fs.readFileSync('extension/content.js','utf8'); if(!c.includes('mail.google.com') || !c.includes('outlook.live.com') || !c.includes('VERIF_GET_EMAIL')) process.exit(1); console.log('Gmail/Outlook integration OK')"
      - name: Validate Intelligence bridge
        run: node -e "const fs=require('fs'); const c=fs.readFileSync('extension/content.js','utf8'); const b=fs.readFileSync('extension/background.js','utf8'); if(!c.includes('VERIF_RESEARCH_REQUEST') || !b.includes('VERIF_RESEARCH') || !fs.existsSync('extension/local-ai.js')) process.exit(1); console.log('VÉRIF Intelligence bridge OK')"
