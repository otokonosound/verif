name: VÉRIF CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

concurrency:
  group: verif-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Test frontend
        run: npm test
      - name: Test extension
        run: npm run test:extension
      - name: Test server engine
        run: npm run test:api
      - name: Build
        run: npm run build
      - name: Validate extension manifest
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('extension/manifest.json','utf8')); if(m.manifest_version!==3 || !m.background?.service_worker || !m.action?.default_popup) process.exit(1); console.log('Manifest V3 OK')"
